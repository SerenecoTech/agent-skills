# Generated by mortar - do not edit. Run 'mortar refresh-proxy' to refresh.
# Pins this project's static IP on the shared egress network so the central
# squid maps it (by source IP) to its ruleset, and routes egress via that
# proxy. project-firewall.sh pins MORTAR_PROXY_IP:PORT from these values.
services:
  app:
    networks:
      egress:
        ipv4_address: 172.31.99.122
    volumes:
      # The machine's ONE Claude credential holder (DECISION-018), read-write
      # and as a DIRECTORY: Claude Code writes the credential by rename, which
      # a single-file bind cannot take, and a container that cannot refresh
      # loses its session when the access token expires.
      - /Users/david/.config/mortar/claude:/home/vscode/.config/mortar/claude
      # The host's own Codex credential, read-write and as a single FILE: codex
      # truncates auth.json in place, and binding the ~/.codex holding it would
      # carry every other project's session history and sqlite logs in with it.
      - /Users/david/.codex/auth.json:/home/vscode/.codex/auth.json
    environment:
      # Where Claude Code reads and writes the credential in this container:
      # the bound machine holder, the same directory the host's export
      # surfaces name.
      CLAUDE_SECURESTORAGE_CONFIG_DIR: /home/vscode/.config/mortar/claude
      HTTP_PROXY: http://172.31.99.10:3128
      HTTPS_PROXY: http://172.31.99.10:3128
      http_proxy: http://172.31.99.10:3128
      https_proxy: http://172.31.99.10:3128
      MORTAR_PROXY_IP: 172.31.99.10
      MORTAR_PROXY_PORT: "3128"
      MORTAR_EGRESS_SUBNET: 172.31.99.0/24
networks:
  egress:
    name: bricklane-egress
    external: true
